[project]
name = "inventory-mcp"
version = "1.0.0"
description = "Inventory service exposed over both a FastAPI REST API and MCP, with shared OAuth 2.1 bearer auth."
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "PyJWT>=2.8",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
inventory-server = "inventory.main:main"
inventory-mcp-stdio = "inventory.mcp_server:mcp.run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inventory"]
